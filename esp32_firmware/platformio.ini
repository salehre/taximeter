; پروژه‌ی PlatformIO برای اکستنشن VS Code
; این پوشه (esp32_firmware) را در VS Code باز کنید، نه پوشه‌ی داخلی را.

[platformio]
; کد اصلی (taxi_meter_esp32.ino و فایل‌های .h) در همین زیرپوشه است
src_dir = taxi_meter_esp32

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM6
monitor_port = COM6
lib_deps =
    mikalhart/TinyGPSPlus
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
